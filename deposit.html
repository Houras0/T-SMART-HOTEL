<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيداع - 1xBet</title>
    <style>
        body { font-family: sans-serif; background: #0e1e2d; color: white; margin: 0; padding: 20px; }
        .method { background: #1c2d3d; border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; border: 1px solid transparent; cursor: pointer; }
        .method:hover { border-color: #3182ce; }
        .icon { width: 50px; height: 50px; border-radius: 10px; margin-left: 15px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; flex-shrink: 0; }
        .name { flex-grow: 1; font-size: 16px; font-weight: bold; }
        h2 { font-size: 18px; border-right: 4px solid #3182ce; padding-right: 10px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <h2>طرق الإيداع الموصى بها</h2>
    <div class="method">
        <div class="icon" style="background: #e60000;">VODAFONE</div>
        <div class="name">فودافون كاش / Vodafone Cash</div>
        <span>➔</span>
    </div>
    <div class="method">
        <div class="icon" style="background: #6c2d91;">INSTAPAY</div>
        <div class="name">انستا باي / InstaPay</div>
        <span>➔</span>
    </div>
</body>
</html>
